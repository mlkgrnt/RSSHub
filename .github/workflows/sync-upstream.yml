name: Sync Upstream

on:
    schedule:
        - cron: '0 0 * * *'
    workflow_dispatch:

permissions:
    contents: write

jobs:
    sync:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: master
                  fetch-depth: 0

            - name: Sync upstream master
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git remote add upstream https://github.com/DIYgod/RSSHub.git || true
                  git fetch upstream
                  if ! git merge upstream/master --no-edit; then
                    # 冲突处理：workflow 文件保留 fork 版本（上游也在持续改这些文件），
                    # 其余冲突说明需要人工介入，直接失败而不是留下半合并状态。
                    conflicts=$(git diff --name-only --diff-filter=U)
                    non_workflow=$(echo "$conflicts" | grep -v '^\.github/workflows/' || true)
                    if [ -n "$non_workflow" ]; then
                      echo "::error::非 workflow 文件存在冲突，需人工处理: $non_workflow"
                      git merge --abort
                      exit 1
                    fi
                    git checkout --ours -- $conflicts
                    git add $conflicts
                    git commit --no-edit
                  fi
                  # GITHUB_TOKEN cannot push workflow file changes, restore them
                  git checkout ORIG_HEAD -- .github/workflows/
                  git diff --cached --quiet || git commit -m "merge upstream, preserve fork workflows"
                  git push origin master

            - name: Rebase custom onto master
              run: |
                  OLD_CUSTOM=$(git rev-parse origin/custom)
                  MERGE_BASE=$(git merge-base origin/master $OLD_CUSTOM)
                  PATCHES=$(git rev-list --reverse $MERGE_BASE..$OLD_CUSTOM)
                  git checkout -B custom origin/master
                  if [ "$MERGE_BASE" != "$(git rev-parse origin/master)" ] && [ -n "$PATCHES" ]; then
                    for p in $PATCHES; do
                      git cherry-pick $p || git cherry-pick --abort
                    done
                  fi
                  # Restore workflow files from master to avoid push restriction
                  git checkout master -- .github/workflows/
                  git diff --cached --quiet || git commit -m "rebase custom, preserve fork workflows"
                  git push origin custom --force-with-lease

            - name: Build deploy
              run: |
                  git checkout -B deploy custom
                  git push origin deploy --force-with-lease
